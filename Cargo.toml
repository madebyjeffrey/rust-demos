[workspace]
members = [
    "apps/galaxy-menu",
    "apps/lcars-console",
    "apps/composable-ui-prototype",
    "apps/garden-ui",
    "crates/lcars-ui",
    "crates/bevy-composable-ui",
]
default-members = ["apps/galaxy-menu"]
resolver = "3"

# Basic optimization keeps Bevy's unwind tables within macOS linker limits.
[profile.dev]
opt-level = 1
